    <script>
      // run before React loads, and keep in sync as the day changes
      const applyTheme = () => {
        const hour = new Date().getHours();
        const theme = hour >= 6 && hour < 18 ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      };
      applyTheme();
      setInterval(applyTheme, 60 * 1000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) applyTheme();
      });

      const params = new URLSearchParams(location.search);

      const fonts = ["mono", "chakra", "press", "silkscreen", "vt323", "inter"];
      const requestedFont = params.get("font");
      document.documentElement.setAttribute("data-font", fonts.includes(requestedFont) ? requestedFont : "mono");

      const backgrounds = ["amber", "navy"];
      const requestedBg = params.get("bg");
      document.documentElement.setAttribute("data-bg", backgrounds.includes(requestedBg) ? requestedBg : "amber");
    </script>
