name: Promote staging to prod

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0

      - name: Fast-forward prod to staging
        run: |
          git fetch origin staging
          git merge --ff-only origin/staging
          git push origin prod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger prod deploy
        run: gh workflow run "Deploy React App to GitHub Pages" --ref prod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
