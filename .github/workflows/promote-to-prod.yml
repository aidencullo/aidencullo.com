name: Promote dev to prod

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0

      - name: Fast-forward prod to dev
        run: |
          git fetch origin dev
          git merge --ff-only origin/dev
          git push origin prod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
